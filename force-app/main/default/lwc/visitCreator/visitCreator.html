<template>
    <lightning-card title="Nowa Wizyta" icon-name="standard:event">
        <div class="slds-p-around_medium">
            <lightning-record-edit-form 
                object-api-name="Medical_Appointment__c" 
                onsuccess={handleSuccess}
                onsubmit={handleSubmit}>
                
                <lightning-messages></lightning-messages>

                <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-size_1-of-2 slds-p-horizontal_small">
                        <lightning-combobox
                            name="recordType"
                            label="Typ Wizyty (Record Type)"
                            value={selectedRecordTypeId}
                            options={recordTypeOptions}
                            onchange={handleRecordTypeChange}
                            required
                            class="slds-m-bottom_small">
                        </lightning-combobox>

                        <lightning-input-field field-name="Patient__c" required></lightning-input-field>
                        
                        <lightning-input-field 
                            field-name="Medical_Facility__c" 
                            onchange={handleFacilityChange} 
                            required>
                        </lightning-input-field>

                        <lightning-input-field 
                            field-name="Doctor__c" 
                            value={selectedDoctorId} 
                            class="slds-hide">
                        </lightning-input-field>

                        <lightning-combobox
                            name="specialization"
                            label="Specjalizacja"
                            value={specialization}
                            options={specializationOptions}
                            onchange={handleSpecChange}
                            required>
                        </lightning-combobox>

                        <lightning-combobox
                            name="doctor"
                            label="Lekarz"
                            value={selectedDoctorId}
                            options={doctorOptions}
                            onchange={handleDoctorChange}
                            required>
                        </lightning-combobox>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-p-horizontal_small">
                        <lightning-input-field field-name="Start_Time__c" required></lightning-input-field>
                        <lightning-input-field field-name="End_Time__c" required></lightning-input-field>
                        <lightning-input-field field-name="Status__c"></lightning-input-field>
                        <lightning-input-field field-name="Visit_Type__c"></lightning-input-field>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-p-horizontal_small slds-m-top_small">
                        <lightning-input-field field-name="Doctor_Notes__c"></lightning-input-field>
                    </div>
                </div>

                <div class="slds-m-top_medium slds-align_absolute-center">
                    <lightning-button label="Anuluj" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
                    <lightning-button type="submit" variant="brand" label="Zapisz"></lightning-button>
                </div>

            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
